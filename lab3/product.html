<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .product {
            width: 350px;
            background-color: white;
            margin: 50px auto;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .product img {
            width: 250px;
        }

        .product h2 {
            color: #222;
        }

        .price {
            font-size: 24px;
            color: green;
            font-weight: bold;
        }

        .buy {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        .buy:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <header>
        <h1>Laptop Store</h1>
    </header>

    <div class="product">

        <img src="https://via.placeholder.com/250x160?text=Laptop" alt="Laptop">

        <h2>HP Laptop</h2>

        <p>Powerful laptop for study, coding and daily work.</p>

        <p class="price">₹95,000</p>

        <p>RAM: 16GB</p>
        <p>Storage: 512GB SSD</p>
        <p>Processor: Intel Core i5</p>

        <button class="buy">Buy Now</button>

    </div>

</body>
</html>
